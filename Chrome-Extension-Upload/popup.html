<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JameClaw Chat</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <div class="app">
      <div class="topbar">
        <img class="brand-icon" src="favicon-96x96.png" alt="JameClaw" />
        <div class="topbar-copy">
          <div class="title">JameClaw Chat</div>
          <div id="status" class="status">Connecting…</div>
        </div>
        <button
          id="conversation-explorer"
          class="more-button"
          type="button"
          aria-label="Open conversation history"
          title="Conversation history"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <span aria-hidden="true">•••</span>
        </button>
      </div>

      <div id="page-context" class="page-context" hidden>
        <div class="page-context-icon" aria-hidden="true">⌁</div>
        <div class="page-context-copy">
          <div id="context-title" class="page-context-title">Reading current page</div>
          <div id="context-detail" class="page-context-detail"></div>
        </div>
      </div>

      <div id="conversation-panel" class="conversation-panel" role="menu" hidden>
        <div class="conversation-panel-header">
          <span>Conversations</span>
          <div class="menu-actions">
            <button id="new-conversation" class="small-button" type="button">New</button>
            <button id="refresh-context" class="small-button" type="button"><span aria-hidden="true">↗</span> Pop out</button>
          </div>
        </div>
        <div id="conversation-list" class="conversation-list"></div>
      </div>

      <div id="messages" class="messages"></div>

      <form id="composer" class="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="Ask about this page"
        ></textarea>
        <button id="send" type="submit" aria-label="Send message" title="Send message">↗</button>
      </form>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
